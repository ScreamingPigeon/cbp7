# Gradient ascent optimizer config for TageDirect
# Minimize MPKI under EPI budget constraint

epi_budget: 900.0
max_iterations: 50
objective: mpki  # minimize

# Starting point: 4x2048 hist 11-48 (862 EPI, ~10% MPKI)
starting_point:
  num_tables: 4
  size: 2048
  tag: 11
  ctr: 1
  hyst: 2
  minh: 11
  maxh: 48
  size_ratio: 1
  p1_table_size: 4096
  p1_hist: 6
  metabits: 4
  metapipe: 2
  decay_ctr: 0
  epoch_ctr_bits: 8
  shared_hys: false
  conf_gate: false
  max_alloc: 1
  # Functor/enum params
  hist_series: geometric
  tag_fn: graded
  size_fn: geo
  decay_policy: mild
  fold_fn: xor
  alloc_trigger: mispredict
  uctr_policy: always_inc

# Parameter search space
# "values" = discrete list (step = ±1 index)
# "min/max/step" = range (step = ±step value)
parameters:
  num_tables:
    values: [2, 3, 4, 5, 6, 7, 8, 10, 12]
  size:
    values: [256, 512, 1024, 2048, 4096]
  tag:
    min: 7
    max: 15
    step: 1
  minh:
    min: 4
    max: 30
    step: 2
  maxh:
    min: 30
    max: 500
    step: 20
  size_ratio:
    values: [1, 2, 4]
  p1_table_size:
    values: [1024, 2048, 4096, 8192, 16384]
  p1_hist:
    min: 4
    max: 12
    step: 1
  metabits:
    values: [2, 3, 4, 6, 8]
  metapipe:
    values: [1, 2, 3]
  decay_ctr:
    values: [0, 4, 8, 12, 16]
  epoch_ctr_bits:
    values: [8, 12, 18]
  shared_hys:
    values: [true, false]
  conf_gate:
    values: [true, false]
  max_alloc:
    values: [1, 2]
  # Functor/enum params
  hist_series:
    values: [geometric, quadratic, superexp, ros]
  tag_fn:
    values: [graded, uniform, step, log]
  size_fn:
    values: [geo, uniform, invgeo, step, sqrthist]
  decay_policy:
    values: [mild, aggressive]
  fold_fn:
    values: [xor, rotatexor]
  alloc_trigger:
    values: [mispredict, base_wrong, disagree, tage_miss, tage_wrong]
  uctr_policy:
    values: [always_inc, faralloc, noalloc, penalty_na]
